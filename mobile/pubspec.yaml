name: pickwell
description: 'A project for Pickwell.'

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  # Keep the package language compatible with the current mapper/Freezed generators.
  # Flutter 3.47.7 supplies Dart 3.13.5 for the actual toolchain.
  sdk: '^3.12.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core Packages
  cupertino_icons: ^2.0.0
  bloc: ^9.2.1 # F
  flutter_bloc: ^9.1.1 # F
  freezed_annotation: ^3.1.0 # F
  json_annotation: ^4.12.0
  get_it: ^9.3.0
  injectable: ^3.0.0 ##
  dio: ^5.11.1
  retrofit: ^4.10.0 ##
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0 ##
  go_router: ^18.0.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  intl: ^0.20.3
  fpdart: ^1.2.0 # F
  logger: ^2.8.0 ##
  internet_connection_checker_plus: ^3.1.2 ##
  auto_mappr_annotation: ^2.4.0 ##

   # Core Packages (Function)
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  in_app_review: ^2.0.12

  # Core Packages (User Interface)
  flutter_native_splash: ^2.4.8 # F
  google_fonts: ^9.0.0
  hugeicons: ^1.2.0
  flutter_svg: ^2.3.0 # F
  cached_network_image: ^4.0.2 ##
  smooth_page_indicator: ^3.0.0 ##
 
  # Variable Packages
  purchases_flutter: ^10.13.2
  sentry_flutter: ^10.0.0
  posthog_flutter: ^5.47.0
  supabase_flutter: ^2.17.2
  drift: 2.34.4
  drift_flutter: ^0.3.1

  ####################

  # Function Packages
  network_info_plus: ^8.2.1
  connectivity_plus: ^7.3.1
  battery_plus: ^7.0.0
  sensors_plus: ^7.0.0
  location: ^10.0.2 # F
  feedback: ^3.2.0 # F
  flutter_keyboard_visibility: ^7.0.1 ##

  # User Interface Packages
  gap: ^3.0.1 ##
  loading_indicator: ^4.0.2 ##
  awesome_snackbar_content: ^0.1.8 ##
  flutter_animate: ^4.5.2 # F
  animated_text_kit: ^4.3.0 # F
  pinput: ^6.0.2 # Keep 6.x while app widgets use SDK Material; 7.x requires material_ui.
  infinite_scroll_pagination: ^5.1.1 # F
  flutter_slidable: ^4.0.3 # F
  swipeable_tile: ^2.0.1 ##
  permission_handler: ^13.0.2
  sign_in_with_apple: ^8.2.0

  vector_graphics: ^1.2.3
  mobile_scanner: 7.5.0
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  freezed: 3.2.5 # F
  flutter_gen_runner: ^5.15.0 ##
  injectable_generator: ^3.0.2 ##
  retrofit_generator: 10.2.9 ##
  auto_mappr: ^2.16.0 ##
  drift_dev: 2.34.0 ##
  import_sorter: ^4.6.0
import_sorter:
  comments: false
  ignored_files:
    - ".*app_localizations.*\\.dart$"

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/icons/flags/
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
          weight: 800

define_app_icon: &app_icon assets/images/app_icon_launcher.png
define_app_icon_foreground: &app_icon_foreground assets/images/app_icon_foreground.png
define_app_icon_background: &app_icon_background "#ffffff"
define_color: &color "#fbfaff" # background and surface color
define_color_dark: &color_dark "#181a1d" # background and surface color

flutter_launcher_icons:
  ios: true
  android: true
  min_sdk_android: 21
  image_path: *app_icon
  adaptive_icon_foreground: *app_icon_foreground
  adaptive_icon_background: *app_icon_background

flutter_native_splash:
  image: *app_icon_foreground
  color: *color

  image_dark: *app_icon_foreground
  color_dark: *color_dark

  android_12:
    image: *app_icon_foreground
    icon_background_color: *color
    image_dark: *app_icon_foreground
    icon_background_color_dark: *color_dark

  web: false

flutter_gen:
  output: lib/src/resources
  line_length: 100

  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

  assets:
    enabled: true
    outputs:
      class_name: AppAssets
      package_parameter_enabled: false
    exclude:
      # - Nothing to exclude
  
  fonts:
    enabled: true
    outputs:
      class_name: AppFonts
      package_parameter_enabled: false
    exclude:
      # - Nothing to exclude
